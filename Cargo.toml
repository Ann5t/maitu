[package]
name = "fudian"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "A durable, evidence-driven workspace for long-running projects"
publish = false

[dependencies]
anyhow = "1.0"
axum = { version = "0.8.9", features = ["form", "json", "macros", "query"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
hex = "0.4"
maud = { version = "0.27.0", features = ["axum"] }
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.9.0", default-features = false, features = ["chrono", "derive", "json", "postgres", "runtime-tokio", "tls-rustls-ring", "uuid"] }
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "macros", "net", "rt-multi-thread", "signal"] }
tower-http = { version = "0.7.0", features = ["compression-gzip", "fs", "request-id", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.18", features = ["serde", "v4"] }
urlencoding = "2.1"

[dev-dependencies]
pretty_assertions = "1.4"

[profile.release]
lto = "thin"
strip = "symbols"
