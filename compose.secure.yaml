name: ${FUDIAN_COMPOSE_PROJECT:-fudian-secure}

x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: fudian
      POSTGRES_USER: fudian
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      data:
        ipv4_address: ${FUDIAN_POSTGRES_DATA_IP:-172.31.0.10}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fudian -d fudian"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
      - /run/postgresql:rw,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: ${FUDIAN_POSTGRES_MEMORY:-1g}
    cpus: ${FUDIAN_POSTGRES_CPUS:-1.5}
    stop_grace_period: 60s
    restart: unless-stopped
    logging: *bounded-logging

  storage-init:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    user: "0:0"
    command:
      - sh
      - -ec
      - >-
        mkdir -p /data/artifacts /data/repositories /data/worktrees /data/runner
        && chown -R 1000:1000 /data/artifacts /data/repositories /data/worktrees /data/runner
    volumes:
      - artifacts:/data/artifacts
      - repositories:/data/repositories
      - worktrees:/data/worktrees
      - runner_outputs:/data/runner
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
      - /var/lib/postgresql/data:rw,noexec,nosuid,nodev
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE"]
    security_opt:
      - no-new-privileges:true
    restart: "no"
    logging: *bounded-logging

  gateway-init:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    user: "0:0"
    command: ["sh", "-ec", "chown -R 1000:1000 /data /config"]
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE"]
    security_opt:
      - no-new-privileges:true
    restart: "no"
    logging: *bounded-logging

  app:
    image: ${FUDIAN_APP_IMAGE:-fudian-private:0.1.0}
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      FUDIAN_AUTH_PEPPER_FILE: /run/secrets/auth_pepper
      FUDIAN_SETUP_TOKEN_FILE: /run/secrets/setup_token
      FUDIAN_WORKER_BOOTSTRAP_TOKEN_FILE: /run/secrets/worker_bootstrap_token
      FUDIAN_SECURITY_MODE: required
      FUDIAN_PUBLIC_ORIGIN: ${FUDIAN_PUBLIC_ORIGIN:?set FUDIAN_PUBLIC_ORIGIN to the exact external HTTPS origin}
      FUDIAN_TRUSTED_PROXY_CIDRS: ${FUDIAN_CADDY_EDGE_IP:-172.30.0.10}/32
      FUDIAN_TOOL_PROXY_ALLOWED_CIDRS: ${FUDIAN_TOOLS_SUBNET:-172.32.0.0/24}
      FUDIAN_BIND: 0.0.0.0:3000
      ARTIFACT_ROOT: /data/artifacts
      REPOSITORY_ROOT: /data/repositories
      WORKTREE_ROOT: /data/worktrees
      RUNNER_OUTPUT_ROOT: /data/runner
      RUNNER_RUNTIME_DIGEST: ${RUNNER_RUNTIME_DIGEST:?set RUNNER_RUNTIME_DIGEST to the approved runner digest}
      DATABASE_MAX_CONNECTIONS: ${FUDIAN_DATABASE_CONNECTIONS:-10}
      INPUT_MAX_BYTES: ${INPUT_MAX_BYTES:-67108864}
      INPUT_CHUNK_MAX_BYTES: ${INPUT_CHUNK_MAX_BYTES:-4194304}
      INPUT_INBOX_COPY_MAX_BYTES: ${INPUT_INBOX_COPY_MAX_BYTES:-1048576}
      RUST_LOG: ${RUST_LOG:-fudian=info,tower_http=info}
    secrets:
      - database_url
      - auth_pepper
      - setup_token
      - worker_bootstrap_token
    volumes:
      - artifacts:/data/artifacts
      - repositories:/data/repositories
      - worktrees:/data/worktrees
      - runner_outputs:/data/runner
    networks:
      edge:
        ipv4_address: ${FUDIAN_APP_EDGE_IP:-172.30.0.20}
      data:
        ipv4_address: ${FUDIAN_APP_DATA_IP:-172.31.0.20}
      tools:
        ipv4_address: ${FUDIAN_APP_TOOLS_IP:-172.32.0.10}
    depends_on:
      postgres:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "fudian", "healthcheck", "127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
      - /home/fudian:rw,noexec,nosuid,nodev
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    init: true
    pids_limit: 384
    mem_limit: ${FUDIAN_APP_MEMORY:-2g}
    cpus: ${FUDIAN_APP_CPUS:-2.0}
    stop_grace_period: 45s
    restart: unless-stopped
    logging: *bounded-logging

  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    user: "1000:1000"
    environment:
      FUDIAN_SITE_HOST: ${FUDIAN_SITE_HOST:?set FUDIAN_SITE_HOST without scheme or port}
    ports:
      - "${FUDIAN_HTTPS_BIND:-127.0.0.1}:${FUDIAN_HTTPS_PORT:-8443}:443"
    volumes:
      - ${FUDIAN_CADDYFILE:-./deploy/Caddyfile.private}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      ingress: {}
      edge:
        ipv4_address: ${FUDIAN_CADDY_EDGE_IP:-172.30.0.10}
    depends_on:
      gateway-init:
        condition: service_completed_successfully
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 15s
      timeout: 5s
      retries: 6
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: ${FUDIAN_CADDY_MEMORY:-256m}
    cpus: ${FUDIAN_CADDY_CPUS:-0.5}
    restart: unless-stopped
    logging: *bounded-logging

secrets:
  postgres_password:
    file: ${FUDIAN_POSTGRES_PASSWORD_FILE:-./secrets/postgres-password}
  database_url:
    file: ${FUDIAN_DATABASE_URL_FILE:-./secrets/database-url}
  auth_pepper:
    file: ${FUDIAN_AUTH_PEPPER_FILE:-./secrets/auth-pepper}
  setup_token:
    file: ${FUDIAN_SETUP_TOKEN_FILE:-./secrets/setup-token}
  worker_bootstrap_token:
    file: ${FUDIAN_WORKER_BOOTSTRAP_TOKEN_FILE:-./secrets/worker-bootstrap-token}

networks:
  # Docker does not activate published host ports for a container attached only
  # to internal networks. Only Caddy joins this ingress bridge; private mode
  # still binds its published port to 127.0.0.1.
  ingress: {}
  edge:
    internal: true
    ipam:
      config:
        - subnet: ${FUDIAN_EDGE_SUBNET:-172.30.0.0/24}
  data:
    internal: true
    ipam:
      config:
        - subnet: ${FUDIAN_DATA_SUBNET:-172.31.0.0/24}
  tools:
    internal: true
    ipam:
      config:
        - subnet: ${FUDIAN_TOOLS_SUBNET:-172.32.0.0/24}

volumes:
  postgres_data:
  artifacts:
  repositories:
  worktrees:
  runner_outputs:
  caddy_data:
  caddy_config:
