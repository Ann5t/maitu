name: quality-gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-stack:
    name: Rust, isolated PostgreSQL, Chromium and runtime image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reserve space for isolated builds on the disposable hosted runner
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        shell: bash
        run: |
          # These preinstalled SDKs are unused by the Docker-based quality gate.
          # Keep this cleanup out of local scripts and self-hosted runners.
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet
          df -h /

      - name: Run the complete isolated quality gate
        run: ./scripts/quality-gate.sh
